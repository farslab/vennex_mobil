# Görsel tur: tüm ana ekranların ekran görüntüsünü alır (açık/koyu tema için ayrı çalıştırılır).
# Önkoşul: yerel backend (backend-local/run.sh server) + seed verisi, oturum açık olabilir/olmayabilir.
# Çalıştırma: (cd çıktı-klasörü && maestro test <repo>/e2e/maestro/90_visual_tour.yaml)
appId: com.vennex.mobileapp
---
- launchApp
- runFlow:
    when:
      visible: "Hesabınıza giriş yapın"
    commands:
      - tapOn:
          id: "login-username"
      - inputText: "demo"
      - tapOn:
          id: "login-password"
      - inputText: "demo1234"
      - tapOn:
          id: "login-submit"
- extendedWaitUntil:
    visible: "Profil"
    timeout: 20000

# Panel
- tapOn: "Panel"
- waitForAnimationToEnd
- takeScreenshot: 01_panel_ust
- scroll
- takeScreenshot: 02_panel_alt
- scroll
- takeScreenshot: 03_panel_son

# Cihazlar
- tapOn: "Cihazlar"
- waitForAnimationToEnd
- takeScreenshot: 10_cihazlar
- tapOn:
    text: "Otomat 01"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 11_cihaz_genel
- tapOn:
    text: "Satışlar"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 12_cihaz_satislar
- tapOn:
    text: "Stok"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 13_cihaz_stok
- tapOn:
    text: "Ayarlar"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 14_cihaz_ayarlar
- back
- waitForAnimationToEnd

# Kartlar
- tapOn: "Kartlar"
- waitForAnimationToEnd
- takeScreenshot: 20_kartlar
- tapOn:
    text: "Kart Grupları"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 21_kart_gruplari

# Stok
- tapOn:
    text: "Stok"
    index: -1
- waitForAnimationToEnd
- takeScreenshot: 30_stok

# Profil
- tapOn: "Profil"
- waitForAnimationToEnd
- takeScreenshot: 40_profil
- scroll
- takeScreenshot: 41_profil_alt
- tapOn:
    text: "Güvenlik"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 42_guvenlik
- back
- tapOn:
    text: "Kullanıcılar"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 43_kullanicilar
- back
- tapOn:
    text: "Raporlar"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 44_raporlar
- back

# Bildirimler
- tapOn:
    id: "header-notifications"
- waitForAnimationToEnd
- takeScreenshot: 50_bildirimler
- back
