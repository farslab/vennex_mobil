# E2E: giriş, hatalı şifre, 2FA, yasal onay kapısı
# Önkoşul: `npm run mock` (yerel mock backend) + development build (APP_ENV=development)
# ÇALIŞTIRMA: maestro test e2e/maestro/01_login_2fa.yaml
appId: tr.com.vennex
---
- launchApp:
    clearState: true
- assertVisible: "Hesabınıza giriş yapın"
- assertVisible: "GELİŞTİRME ORTAMI"

# Boş form doğrulaması
- tapOn:
    id: "login-submit"
- assertVisible: "Kullanıcı adı veya e-posta gerekli."

# Hatalı şifre
- tapOn:
    id: "login-username"
- inputText: "demo"
- tapOn:
    id: "login-password"
- inputText: "yanlis-sifre"
- tapOn:
    id: "login-submit"
- assertVisible: "Kullanıcı adı veya parola hatalı."

# 2FA kullanıcısı
- tapOn:
    id: "login-username"
- eraseText: 20
- inputText: "demo2fa"
- tapOn:
    id: "login-password"
- eraseText: 30
- inputText: "demo1234"
- tapOn:
    id: "login-submit"
- assertVisible: "İki adımlı doğrulama"

# Hatalı kod → kalan hak
- inputText: "000000"
- assertVisible: "Geçersiz kod."
- assertVisible: "Kalan deneme hakkı: 4"

# Doğru kod
- inputText: "123456"

# demo2fa kullanıcısının bekleyen KVKK onayı var → onay kapısı
- assertVisible: "Kabul Ediyorum"
- tapOn: "Kabul Ediyorum"
- assertVisible: "Panel"
